<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1018" />
    <meta name="description" content="Stratum is a local-first, versioned, searchable asset vault for game studios. Free and open source. Every version of every asset, safely on your own machines." />
    <meta name="keywords" content="asset management, game development, version control, local-first, offline, digital asset management, tauri" />
    <meta name="author" content="Akkil M G (Arkynox)" />
    <meta name="license" content="Stratum Community License - https://github.com/AkkilMG/Stratum/blob/main/LICENSE.txt" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stratum — local-first asset vault for game studios" />
    <meta property="og:description" content="Versioned, searchable, offline-first asset management for game art, maps and 3D models. Free and open source." />
    <meta property="og:url" content="https://github.com/AkkilMG/Stratum" />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://github.com/AkkilMG/Stratum" />
    <title>Stratum</title>
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
