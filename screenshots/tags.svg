<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2f6b"/><stop offset="1" stop-color="#8b7dff"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0f1014"/>
  <rect x="0" y="0" width="1600" height="900" fill="#0f1014" opacity="0.9"/>

  <!-- Panel -->
  <rect x="300" y="120" width="1000" height="660" rx="18" fill="#15161d" stroke="#262936"/>
  <text x="348" y="176" fill="#e7e9f2" font-size="22" font-weight="700">Tags</text>
  <text x="348" y="202" fill="#9aa0b4" font-size="13">Organize assets with your own tags — and let local AI suggest more.</text>

  <!-- Preview + asset name -->
  <rect x="348" y="228" width="200" height="140" rx="10" fill="url(#tg1)"/>
  <circle cx="448" cy="298" r="34" fill="#0f1014" opacity="0.22"/>
  <text x="572" y="262" fill="#e7e9f2" font-size="17" font-weight="600">hero_armor.psd</text>
  <text x="572" y="286" fill="#9aa0b4" font-size="12">Source file · 156 MB</text>
  <rect x="572" y="304" width="150" height="30" rx="8" fill="#0e3f3a"/>
  <text x="647" y="324" fill="#2dd4bf" font-size="12" text-anchor="middle">✦ Suggest with AI</text>

  <!-- Manual tags -->
  <text x="348" y="418" fill="#9aa0b4" font-size="12" font-weight="600" letter-spacing="1">MANUAL TAGS</text>
  <g font-size="13">
    <rect x="348" y="432" width="120" height="34" rx="17" fill="#1e1b3a"/><text x="408" y="454" fill="#8b7dff" text-anchor="middle">character ×</text>
    <rect x="480" y="432" width="96" height="34" rx="17" fill="#1e1b3a"/><text x="528" y="454" fill="#8b7dff" text-anchor="middle">armor ×</text>
    <rect x="588" y="432" width="110" height="34" rx="17" fill="#1e1b3a"/><text x="643" y="454" fill="#8b7dff" text-anchor="middle">game-ready ×</text>
  </g>

  <!-- Add tag combobox -->
  <text x="348" y="512" fill="#9aa0b4" font-size="12" font-weight="600" letter-spacing="1">ADD A TAG</text>
  <rect x="348" y="526" width="380" height="40" rx="8" fill="#171922" stroke="#8b7dff"/>
  <text x="366" y="551" fill="#e7e9f2" font-size="13">ar</text>
  <rect x="348" y="574" width="380" height="150" rx="10" fill="#121319" stroke="#262936"/>
  <g font-size="13">
    <rect x="348" y="574" width="380" height="38" rx="10" fill="#1e1b3a"/>
    <text x="366" y="598" fill="#e7e9f2">armor</text><text x="690" y="598" fill="#9aa0b4" font-size="11" text-anchor="end">42 assets</text>
    <text x="366" y="636" fill="#c8ccdb">armored</text><text x="690" y="636" fill="#9aa0b4" font-size="11" text-anchor="end">8 assets</text>
    <text x="366" y="668" fill="#c8ccdb">armory</text><text x="690" y="668" fill="#9aa0b4" font-size="11" text-anchor="end">3 assets</text>
    <rect x="348" y="686" width="380" height="38" rx="0" fill="none"/>
    <text x="366" y="710" fill="#8b7dff">+ Create "ar"</text>
  </g>

  <!-- AI tags -->
  <text x="776" y="418" fill="#9aa0b4" font-size="12" font-weight="600" letter-spacing="1">AI-SUGGESTED (LLAVA)</text>
  <g font-size="13">
    <rect x="776" y="432" width="110" height="34" rx="17" fill="#0e3f3a"/><text x="831" y="454" fill="#2dd4bf" text-anchor="middle">✦ golden +</text>
    <rect x="898" y="432" width="112" height="34" rx="17" fill="#0e3f3a"/><text x="954" y="454" fill="#2dd4bf" text-anchor="middle">✦ ornate +</text>
    <rect x="1022" y="432" width="132" height="34" rx="17" fill="#0e3f3a"/><text x="1088" y="454" fill="#2dd4bf" text-anchor="middle">✦ medieval +</text>
    <rect x="776" y="482" width="130" height="34" rx="17" fill="#0e3f3a"/><text x="841" y="504" fill="#2dd4bf" text-anchor="middle">✦ metal +</text>
    <rect x="918" y="482" width="118" height="34" rx="17" fill="#0e3f3a"/><text x="977" y="504" fill="#2dd4bf" text-anchor="middle">✦ gold +</text>
  </g>

  <!-- Progress meter -->
  <rect x="776" y="560" width="380" height="88" rx="12" fill="#121319" stroke="#262936"/>
  <text x="798" y="592" fill="#e7e9f2" font-size="13" font-weight="600">Auto-tagging progress</text>
  <text x="1134" y="592" fill="#8b7dff" font-size="13" text-anchor="end">68%</text>
  <rect x="798" y="608" width="336" height="8" rx="4" fill="#262936"/>
  <rect x="798" y="608" width="228" height="8" rx="4" fill="#8b7dff"/>
  <text x="798" y="634" fill="#9aa0b4" font-size="11">8,486 of 12,480 assets described locally. Runs in the background.</text>

  <!-- Note -->
  <rect x="348" y="690" width="808" height="56" rx="10" fill="#171922" stroke="#262936"/>
  <text x="368" y="714" fill="#2dd4bf" font-size="12" font-weight="600">i  Shared tags</text>
  <text x="368" y="734" fill="#9aa0b4" font-size="12">Tags are stored in .stratum-tags.json so teammates see them after sync.</text>
</svg>
