  <circle cx="626" cy="575" r="20" fill="#1e1b3a"/>
  <text x="626" y="581" fill="#8b7dff" font-size="15" text-anchor="middle" font-weight="600">A</text>
  <text x="660" y="570" fill="#e7e9f2" font-size="14" font-weight="600">Akkil M G</text>
