    <text x="604" y="176" fill="#9aa0b4" font-size="12">Assets</text>
    <text x="604" y="210" fill="#e7e9f2" font-size="26" font-weight="700">12,480</text>

    <rect x="900" y="130" width="300" height="110" rx="12" fill="#15161d" stroke="#262936"/>
