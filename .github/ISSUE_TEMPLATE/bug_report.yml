name: Bug report
description: Report a problem with Stratum
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill this in as completely as you can.
        For security vulnerabilities, do **not** use this form — see [SECURITY.md](https://github.com/AkkilMG/Stratum/blob/main/SECURITY.md).
  - type: checkboxes
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I am using the latest version of Stratum.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open a vault
        2. Drag in a PSD file
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    attributes:
      label: Stratum version
      description: Found in Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Storage setup
      options:
        - This PC only
        - This PC + NAS
        - Joined a studio space
        - Not sure
  - type: textarea
    attributes:
      label: Diagnostics and logs
      description: |
        Paste the output of **Settings → Help & about → Copy diagnostics** here.
        Feel free to redact personal paths.
      render: text
  - type: textarea
    attributes:
      label: Screenshots / recordings
      description: If applicable, add screenshots or a short recording.
  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that might help.
