# Free Authenticode signing for open-source Windows builds via SignPath Foundation.
#
# This workflow is OPTIONAL and disabled by default. It does nothing unless the
# repository variable SIGNPATH_ENABLED is set to "true" and the SignPath secrets
# below exist. See docs/CERTIFICATION.md for how to apply to the SignPath
# Foundation (free for OSI-approved open-source projects) and how to fill these in.
#
# Choose ONE Windows signing path:
#   - release.yml  -> PFX via scripts/sign-windows.ps1 (paid OV/EV cert, or Certum Open Source)
#   - signpath.yml -> SignPath Foundation (free TBD signing for OSS)
name: signpath

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - run: npm run icons
      - name: Build unsigned installers
        run: npm run tauri build
      - name: Upload unsigned Windows artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: stratum-windows-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  sign:
    if: vars.SIGNPATH_ENABLED == 'true'
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stratum-windows-signed
          path: signed/**
      - name: Attach signed installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          find signed -type f \( -name '*.msi' -o -name '*.exe' \) -print0 \
            | xargs -0 gh release upload "${{ github.ref_name }}" --clobber
