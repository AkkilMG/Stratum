# Builds production installers for every platform, uploads them as downloadable
# Actions artifacts, and (by default) commits them into the release/ folder so a
# simple `git pull` brings them to any machine - handy without Linux/macOS locally.
#
# Run it from the Actions tab: Actions -> build-installers -> Run workflow.
# Uses only the built-in token.
name: build-installers

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the built installers into the release/ folder
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-installers
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
          - os: macos-latest
            platform: macOS
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      # Optional Windows Authenticode signing; scripts/sign-windows.ps1 no-ops when unset.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      # Required to also emit auto-updater artifacts (.sig); falls back to installers-only.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run icons
      - name: Build (with updater artifacts)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Build (installers only, no signing key configured)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: npx tauri build
      - name: List built bundle files
        if: always()
        shell: bash
        run: find src-tauri/target/release/bundle -maxdepth 3 -type f 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: stratum-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  collect:
    name: Bundle all artifacts
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: all
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: stratum-installers-all
          if-no-files-found: error
          path: all/**

  commit:
    name: Commit installers to release/
    needs: [build, collect]
    if: ${{ !cancelled() && inputs.commit }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: stratum-installers-all
          path: _artifacts
      - name: Flatten installers into release/
        shell: bash
        run: |
          mkdir -p release
          find _artifacts -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp -t release/ {} +
          rm -rf _artifacts
          ls -la release/
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release
          if git diff --cached --quiet; then
            echo "No installer changes to commit."
            exit 0
          fi
          git commit -m "chore(release): add built installers [skip ci]"
          git push
