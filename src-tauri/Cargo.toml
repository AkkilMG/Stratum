[package]
name = "stratum"
version = "0.1.0"
edition = "2021"
description = "Stratum: local-first, versioned, searchable asset management for game studios. A product of Arkynox."
authors = ["Akkil M G (https://github.com/AkkilMG)"]
homepage = "https://arkynox.com"
repository = "https://github.com/AkkilMG/Stratum"
license = "Apache-2.0 OR LicenseRef-Stratum-Community-1.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
notify = "8"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.23"
resvg = "0.48"
psd = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
