[package]
name = "stratum"
version = "0.1.0"
edition = "2021"
description = "Stratum: local-first, versioned, searchable asset management for game studios. A product of Arkynox."
authors = ["Akkil M G (https://github.com/AkkilMG)"]
homepage = "https://arkynox.com"
repository = "https://github.com/AkkilMG/Stratum"
license-file = "../LICENSE.txt"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
notify = "6"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.22"
resvg = "0.48"
psd = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
